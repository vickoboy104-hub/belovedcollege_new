name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, iconv, intl, json, libxml, mbstring, openssl, pcre, pdo, pdo_sqlite, session, simplexml, sodium, sqlite3, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Reject tracked credential exports
        run: |
          if git ls-files 'storage/exports/*.csv' | grep -q .; then
            echo "Credential export CSV files must never be committed."
            exit 1
          fi

      - name: Prepare environment files
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: |
          composer config --global github-oauth.github.com "${{ github.token }}"
          composer validate --no-check-publish --quiet
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader --quiet

      - name: Prepare Laravel database
        run: |
          php artisan key:generate --quiet
          php artisan migrate:fresh --seed --force --quiet
          php artisan optimize:clear

      - name: Verify routes
        run: php artisan route:list --except-vendor

      - name: Run automated tests
        run: composer test > test-output.txt 2>&1

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 3

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

  mobile-portal:
    name: Mobile portal smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, iconv, intl, json, libxml, mbstring, openssl, pcre, pdo, pdo_sqlite, session, simplexml, sodium, sqlite3, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare application
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          composer config --global github-oauth.github.com "${{ github.token }}"
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader --quiet
          npm ci --no-audit --no-fund
          php artisan key:generate --quiet
          php artisan migrate:fresh --seed --force --quiet
          php artisan optimize:clear
          npm run build

      - name: Make seeded portal accounts browser-test ready
        run: |
          php artisan tinker --execute="\App\Models\User::query()->whereIn('email', ['student.jss-1-general.1@belovedschool.test', 'parent.jss-1-general.1@belovedschool.test'])->update(['must_change_password' => false]);"
          php artisan tinker --execute="$u=\App\Models\User::query()->where('role','admin')->first(); if($u){$u->forceFill(['email'=>'qa.finance.admin@belovedschool.test','password'=>\Illuminate\Support\Facades\Hash::make('password'),'must_change_password'=>false,'email_verified_at'=>now(),'status'=>'active'])->save();}"
          php artisan tinker --execute="echo 'QA_INVOICE_ID='.(\App\Models\FeeInvoice::query()->value('id') ?: 1);" >> "$GITHUB_ENV"

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Start Laravel application
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/beloved-laravel.log 2>&1 &
          echo $! > /tmp/beloved-laravel.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/up > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/beloved-laravel.log
          exit 1

      - name: Run portal and finance browser smoke tests
        env:
          APP_URL: http://127.0.0.1:8000
        run: node tools/mobile-portal-smoke.mjs

      - name: Upload finance screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-ux-screenshots
          path: artifacts/finance-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Laravel log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-portal-laravel-log
          path: /tmp/beloved-laravel.log
          if-no-files-found: ignore
          retention-days: 3
